name: Neura Weekly Digest

on:
  workflow_dispatch:   # cron-job.org の固定ジョブ（毎週土曜12:00 JST）からトリガーする

jobs:
  weekly-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read         # 読み取りのみ。リポジトリ既定の権限に依存しない
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # sgmllib3k は sdist のみ。ビルド依存もハッシュ検証の対象にするため、
          # ハッシュ固定の setuptools を先に入れ、分離ビルドを使わずにインストールする
          pip install --require-hashes --only-binary :all: -r requirements-build.txt
          pip install --require-hashes --no-build-isolation -r requirements.txt

      - name: Send weekly digest (FR-09)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/weekly_digest.py
